description = "Terrarium venue: 6 m LED bars + 3 fiber-optic engines, two WLED controllers"
backends = ["devicelink", "array"]

[[fixtures]]
name = "bars"
# Art-Net wire order. WLED's own LED settings carry the strip's physical GRBW.
color_order = "RGBW"
instrument = "venue_array"
  [[fixtures.blocks]]
  name = "m1"
  start = 0
  count = 144
  [[fixtures.blocks]]
  name = "m2"
  start = 144
  count = 144
  [[fixtures.blocks]]
  name = "m3"
  start = 288
  count = 144
  [[fixtures.blocks]]
  name = "m4"
  start = 432
  count = 144
  [[fixtures.blocks]]
  name = "m5"
  start = 576
  count = 144
  [[fixtures.blocks]]
  name = "m6"
  start = 720
  count = 144
  [[fixtures.zones]]
  name = "left"
  start = 0
  count = 288
  [[fixtures.zones]]
  name = "center"
  start = 288
  count = 288
  [[fixtures.zones]]
  name = "right"
  start = 576
  count = 288

# One block per RGBW engine, one zone per bundle. N = 1 LED per engine until
# the hardware owner supplies it (spec 2026-09-25 section 2, input I1): each
# engine's block/zone count is N and each start is a multiple of N.
[[fixtures]]
name = "fiber"
color_order = "RGBW"
instrument = "venue_fiber"
  [[fixtures.blocks]]
  name = "e1"
  start = 0
  count = 1
  [[fixtures.blocks]]
  name = "e2"
  start = 1
  count = 1
  [[fixtures.blocks]]
  name = "e3"
  start = 2
  count = 1
  [[fixtures.zones]]
  name = "b1"
  start = 0
  count = 1
  [[fixtures.zones]]
  name = "b2"
  start = 1
  count = 1
  [[fixtures.zones]]
  name = "b3"
  start = 2
  count = 1
