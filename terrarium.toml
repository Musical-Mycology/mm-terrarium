schema = 1

[terrarium]
name = "dev-box"
bit_paths = ["bits"]
instrument_paths = ["instruments"]

[rooms.TEST]
description = "Simulated dev room: main + accent strips"
backends = ["devicelink"]

  [[rooms.TEST.fixtures]]
  name = "main"
  color_order = "GRB"
  instrument = "dev_strip_main"
    [[rooms.TEST.fixtures.blocks]]
    name = "main"
    start = 0
    count = 60
    [[rooms.TEST.fixtures.zones]]
    name = "left"
    start = 0
    count = 20
    [[rooms.TEST.fixtures.zones]]
    name = "center"
    start = 20
    count = 20
    [[rooms.TEST.fixtures.zones]]
    name = "right"
    start = 40
    count = 20

  [[rooms.TEST.fixtures]]
  name = "accent"
  color_order = "GRB"
  instrument = "dev_strip_accent"
    [[rooms.TEST.fixtures.blocks]]
    name = "accent"
    start = 0
    count = 30
    [[rooms.TEST.fixtures.zones]]
    name = "low"
    start = 0
    count = 15
    [[rooms.TEST.fixtures.zones]]
    name = "high"
    start = 15
    count = 15

