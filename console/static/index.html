<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium Console</title>
<link rel="stylesheet" href="terrarium.css">
</head>
<body>
<div class="topbar">
  <span class="wordmark"><span class="orn">&#10022;</span> Terrarium Console</span>
  <span id="connChip" class="chip dim">connecting&hellip;</span>
  <span class="spacer"></span>
  <span id="roomChip" class="chip dim" hidden></span>
</div>
<div class="shell">
  <div class="sidebar">
    <p class="navlabel">Loaded Bit</p>
    <div id="bitPanel"></div>
    <div id="registrationCard" class="sidecard"></div>
    <nav class="viewnav">
      <button id="navLive" class="navbtn active">Live</button>
      <button id="navRoom" class="navbtn">Room: none</button>
      <button id="navDesign" class="navbtn">Design</button>
      <button id="navLog" class="navbtn">Event Log</button>
    </nav>
  </div>
  <div class="content">
    <div id="viewLive" class="maincol">
      <div id="roomCard" class="card"></div>
      <div id="bitStatusCard" class="card" hidden></div>
    </div>
    <div id="viewRoom" class="maincol" hidden>
      <section id="roomsPanel" class="roomspanel"></section>
    </div>
    <div id="viewDesign" class="maincol" hidden>
      <section id="designPanel" class="card">
        <div id="designList"></div>
        <textarea id="designText" spellcheck="false"></textarea>
        <div id="designErrors"></div>
        <div class="actions">
          <button id="designSave" class="btn solid-gold">Save</button>
          <button id="designPublish" class="btn solid-gold">Publish</button>
          <button id="designClone" class="btn">Clone</button>
        </div>
      </section>
    </div>
    <div id="viewLog" class="maincol" hidden>
      <div id="logCard" class="card"></div>
    </div>
  </div>
</div>
<div id="overlayMount"></div>
<script type="module" src="shell.js"></script>
</body>
</html>
