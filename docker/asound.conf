# Route ALSA's default device (PortAudio inside Arco) to PulseAudio: WSLg's
# server, or the host's native one, via PULSE_SERVER set by terrarium-dev.
# The fallback matters when there is no PulseAudio server (--headless, the
# hermetic self-check): without it Arco segfaults at startup (exit -11) once
# PortAudio opens the pulse PCM and the connection fails.
pcm.!default { type pulse
  fallback "sysdefault" }
ctl.!default { type pulse }
