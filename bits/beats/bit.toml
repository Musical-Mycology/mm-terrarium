[bit]
name = "BeatsBit"
version = "0.1.0"
description = "Beats: a devtower and up to three tuneshrooms connect, and the Console's Start button plays the chosen music"
entry = "beats_bit:BeatsBit"
kind = "music"
author = "Musical Mycology"
requires_terrarium_api = 1

[launch]
room_types = ["MIDITEST"]
default_room_type = "MIDITEST"
default_devices = 0
default_join_role = "shroom"
device_instrument = "tuneshroom"
manual_devices = true

[launch.nodes]
shroom = "BEATS_SHROOM_NODE"
tower = "BEATS_TOWER_NODE"

[start]
when = "immediate"

[console]
display_name = "Beats"
notes = "Connect one devtower<N> device and up to three ie<N> tuneshrooms, choose which tuneshroom is each player with the Player 1, 2 and 3 dropdowns on the Bit status card (each lists the connected tuneshrooms, and picking one already another player's swaps the two; until picked, they are numbered in connection order, and the players are fixed at Start), then choose the music with the Music dropdown (music1 until picked; fixed at Start) and the call with the Beats dropdown (beats1 until picked, or beats2, beats3, beats4; fixed at Start: beats1 asks for taps only, beats2 for taps and swings, beats3 and beats4 for taps, swings and squeezes, each gesture with its own rhythm), and press Start; it starts however many of them are connected. Start plays every track of the music together: music1's 808, Abel bass, sine keys and Thicket kit, each a 32-beat loop. The music plays from the Room's speaker, not the devtower's, and loops until the Bit is unloaded. The chosen beats' rhythms, all gestures together, play in measure 1 of every four and light the tower's four responders: a beat from 1 to 1.99 lights the first, 2 to 2.99 the second, 3 to 3.99 the third and 4 to 4.99 the fourth, red for a tap, green for a swing and blue for a squeeze, each fading to dark over a quarter of a second; gestures on the same beat, or a beat landing on a responder still fading from another gesture, mix their colours (a tap and a swing light yellow, all three white). The lights are held back by the mean delay last measured in Calibration, or 175 ms if none has been since the Terrarium started, shown as light delay on the status card. A tap on player 1's tuneshroom blinks every player's purple, and a swing on player 2's blinks every player's yellow, each fading to dark within a fifth of a second, with or without Start; the other players' taps and swings blink nothing (their taps still score). After Start, measures 2, 3 and 4 of every four are the players' answer: each player repeats measure 1's rhythm in each of them, all three judged, on their tuneshroom, tapping, swinging and squeezing each on its own rhythm, each judged separately. A tap within a quarter of a beat either side of a beat earns up to 1, more the closer it is, with a tap up to 20 ms late counting as dead on and dead on itself set 200 ms after the beat, and each player's score from 0 to 1 shows on the status card. A squeeze on any player's tuneshroom is printed to the log. Every gesture judged GOOD (see below) plays, on that player's own tuneshroom, the key music1's Basic Sine Keys has sounding at the answer beat it took (so GOOD gestures play the keys' line), and every one judged BAD key 49, a tap or swing on the guzheng and a squeeze on the chime, sent as /ie<N>/play 'guzheng' 'key=60' and so on. A gesture not judged (before Start, or near no beat asking for it) plays as before: a tap guzheng key 69, a squeeze chime key 75, a swing nothing. The Room plays nothing for a gesture. Each answer beat is also rated for each player as it closes: GOOD for a tap within that quarter of a beat, BAD for a tap outside it but within half a beat either side (it earns 0), and MISS when no gesture took it; the status card counts each player's GOOD, BAD and MISS. Every gesture earning more than 0.1 adds 1 to the players' shared progress, out of 50, which fills the tower's bar from the bottom."

[assets]
# music1: all four play together from Start
sub_808 = "assets/music/music1/2-808 Pure 1.mid"
abel_bass = "assets/music/music1/3-Abel Bass 1.mid"
sine_keys = "assets/music/music1/4-Basic Sine Keys 1.mid"
thicket_kit = "assets/music/music1/6-Thicket Kit 1.mid"
# the Beats dropdown's choices: each gesture's one-measure call
beats1_tap = "assets/judging/beats1/tap.mid"
beats2_tap = "assets/judging/beats2/tap.mid"
beats2_swing = "assets/judging/beats2/swing.mid"
beats3_tap = "assets/judging/beats3/tap.mid"
beats3_swing = "assets/judging/beats3/swing.mid"
beats3_squeeze = "assets/judging/beats3/squeeze.mid"
beats4_tap = "assets/judging/beats4/tap.mid"
beats4_swing = "assets/judging/beats4/swing.mid"
beats4_squeeze = "assets/judging/beats4/squeeze.mid"
