[bit]
name = "BeatsBit"
version = "0.1.0"
description = "Beats: a devtower and up to three tuneshrooms connect; the Console's Test button loops the chosen call, Start plays the 80-measure game"
entry = "beats_bit:BeatsBit"
kind = "music"
author = "Musical Mycology"
requires_terrarium_api = 1

[launch]
room_types = ["MIDITEST"]
default_room_type = "MIDITEST"
default_devices = 0
default_join_role = "shroom"
device_instrument = "tuneshroom"
manual_devices = true

[launch.nodes]
shroom = "BEATS_SHROOM_NODE"
tower = "BEATS_TOWER_NODE"

[start]
when = "immediate"

[console]
display_name = "Beats"
notes = "Connect one devtower<N> device and up to three ie<N> tuneshrooms, choose which tuneshroom is each player with the Player 1, 2 and 3 dropdowns on the Bit status card (each lists the connected tuneshrooms, and picking one already another player's swaps the two; until picked, they are numbered in connection order, and the players are fixed at Start), then choose the music with the Music dropdown (music1 until picked; fixed at Start) and the call with the Tap, Swing and Squeeze dropdowns (each lists that gesture's beat maps, named like tap-X-Y for difficulty X and variation Y, plus none, which asks for none of that gesture; tap-1-1, swing-1-1 and squeeze-1-1 until picked; fixed at Start), and press Test, which plays that call in every four measures until the Bit is unloaded; it starts however many of them are connected. Or press Start to play the game instead: 80 measures (about 2 minutes 28 seconds at 130 BPM), 20 rounds of four measures, after which the music, lights and judging stop. The game picks each round's call itself, shown on the Tap, Swing and Squeeze dropdowns, and the status card shows the stage and round. A round is passed when every player whose gesture it asked for got more than half of that gesture's answer beats GOOD; a failed round plays the same call again. Stage 1 teaches the signals: tap-1-1 alone until player 1 passes it, then swing-1-1 alone until player 2 does, then squeeze-1-1 alone until player 3 does. Stage 2 asks for all three at once, each a random difficulty-1 map, picking a different random call after each pass, until 5 passes. Stage 3 is the same with difficulty-1 and difficulty-2 maps, until the 80 measures end. A late gesture on the last beat of a round may be judged after the next round's call is picked: it still scores but does not count towards passing. Start plays every track of the music together: music1's 808, Abel bass, sine keys and Thicket kit, each a 32-beat loop. The music plays from the Room's speaker, not the devtower's, and loops until the Bit is unloaded. The chosen beat maps' rhythms, all gestures together, play in measure 1 of every four and light the tower's four responders: a beat from 1 to 1.99 lights the first, 2 to 2.99 the second, 3 to 3.99 the third and 4 to 4.99 the fourth, red for a tap, green for a swing and blue for a squeeze, each fading to dark over a quarter of a second; gestures on the same beat, or a beat landing on a responder still fading from another gesture, mix their colours (a tap and a swing light yellow, all three white). The lights are held back by the mean delay last measured in Calibration, or 175 ms if none has been since the Terrarium started, shown as light delay on the status card. Each gesture counts from one player only: taps from player 1, swings from player 2 and squeezes from player 3; any other player's tap, swing or squeeze is ignored (not judged, printed, sounded or blinked). Each gesture blinks only its own player's tuneshroom: player 1's tap magenta, player 2's swing yellow and player 3's squeeze cyan, each fading to dark within a fifth of a second, with or without Start; no other tuneshroom sees it. After Start, measures 2, 3 and 4 of every four are the players' answer: player 1 taps, player 2 swings and player 3 squeezes measure 1's rhythm for their gesture in each of them, all three judged. A tap within 0.35 of a beat either side of a beat earns up to 1, more the closer it is, with a tap up to 20 ms late counting as dead on and dead on itself set 200 ms after the beat, and each player's score from 0 to 1 shows on the status card. A squeeze on player 3's tuneshroom is printed to the log. Every gesture judged GOOD (see below) plays, on that player's own tuneshroom, the key music1's Basic Sine Keys has sounding at the answer beat it took (so GOOD gestures play the keys' line), and every one judged BAD key 36, a tap on the guzheng, a swing on the glissando and a squeeze on the chime, sent as /ie<N>/play 'guzheng' 'key=60' and so on. A gesture not judged (before Start, or near no beat asking for it) plays as before: a tap guzheng key 69, a swing glissando key 69, a squeeze chime key 75. The Room plays nothing for a gesture. Each answer beat is also rated, for its gesture's player only, as it closes: GOOD for a tap within that 0.35 of a beat, BAD for a tap outside it but within 0.6 of a beat either side (it earns 0), and MISS when no gesture took it; the status card counts each player's GOOD, BAD and MISS. Every gesture earning more than 0.1 adds 1 to the players' shared progress, out of 50, which fills the tower's bar from the bottom."

[assets]
# music1: all four play together from Start
sub_808 = "assets/music/music1/2-808 Pure 1.mid"
abel_bass = "assets/music/music1/3-Abel Bass 1.mid"
sine_keys = "assets/music/music1/4-Basic Sine Keys 1.mid"
thicket_kit = "assets/music/music1/6-Thicket Kit 1.mid"
# the Tap, Swing and Squeeze dropdowns' choices: each a one-measure call for
# its gesture, named <gesture>-<difficulty>-<variation>
tap-1-1 = "assets/judging/taps/tap-1-1.mid"
tap-1-2 = "assets/judging/taps/tap-1-2.mid"
tap-2-1 = "assets/judging/taps/tap-2-1.mid"
tap-2-2 = "assets/judging/taps/tap-2-2.mid"
swing-1-1 = "assets/judging/swings/swing-1-1.mid"
swing-1-2 = "assets/judging/swings/swing-1-2.mid"
swing-2-1 = "assets/judging/swings/swing-2-1.mid"
swing-2-2 = "assets/judging/swings/swing-2-2.mid"
squeeze-1-1 = "assets/judging/squeezes/squeeze-1-1.mid"
squeeze-1-2 = "assets/judging/squeezes/squeeze-1-2.mid"
squeeze-2-1 = "assets/judging/squeezes/squeeze-2-1.mid"
squeeze-2-2 = "assets/judging/squeezes/squeeze-2-2.mid"
