[bit]
name = "BeatsBit"
version = "0.1.0"
description = "Beats: a devtower and up to three tuneshrooms connect, and the Console's Start button plays the chosen music, music1 or music2"
entry = "beats_bit:BeatsBit"
kind = "music"
author = "Musical Mycology"
requires_terrarium_api = 1

[launch]
room_types = ["MIDITEST"]
default_room_type = "MIDITEST"
default_devices = 0
default_join_role = "shroom"
device_instrument = "tuneshroom"
manual_devices = true

[launch.nodes]
shroom = "BEATS_SHROOM_NODE"
tower = "BEATS_TOWER_NODE"

[start]
when = "immediate"

[console]
display_name = "Beats"
notes = "Connect one devtower<N> device and up to three ie<N> tuneshrooms, choose which tuneshroom is each player with the Player 1, 2 and 3 buttons on the Bit status card (each press moves that player to the next connected tuneshroom, swapping with whichever player it was; until pressed, they are numbered in connection order, and the players are fixed at Start), then choose the music with the Music button (music1, the piano, until pressed; fixed at Start), and press Start; it starts however many of them are connected. Start plays the music's first track only, and its other tracks come in one at a time, in order, as the players' shared progress grows: of n tracks, track k (from 0) comes in at k/n of the 50, rounded up, so music2's seven files enter at progress 0, 8, 15, 22, 29, 36 and 43, and tracks on the status card shows how many are in. The music plays from the Room's speaker, not the devtower's, and loops until the Bit is unloaded. The beats of measures 1 and 3 of every four light the tower's four responders: a beat from 1 to 1.99 lights the first, 2 to 2.99 the second, 3 to 3.99 the third and 4 to 4.99 the fourth, each fading to dark over a quarter of a second. The lights are held back by the mean delay last measured in Calibration, or 175 ms if none has been since the Terrarium started, shown as light delay on the status card. A tap on any player's tuneshroom blinks every player's purple, fading to dark within a fifth of a second, with or without Start. After Start, measures 2 and 4 are the players' answer: each player taps the rhythm of the measure before on their tuneshroom. A tap within a quarter of a beat either side of a beat earns up to 1, more the closer it is, with a tap up to 20 ms late counting as dead on and dead on itself set 200 ms after the beat, and each player's score from 0 to 1 shows on the status card. Every tap earning more than 0.1 adds 1 to the players' shared progress, out of 50, which fills the tower's bar from the bottom."

[assets]
# music1
piano = "assets/music/music1/piano.mid"
# music2: its files come in in this order as progress grows
bass_kick = "assets/music/music2/1_BassKick.mid"
hihat = "assets/music/music2/2_HiHat.mid"
humonger_bass = "assets/music/music2/3_HumongerBass.mid"
hihat_x2 = "assets/music/music2/4_HiHatx2.mid"
saw_pad = "assets/music/music2/5_BasicSawPad.mid"
ag_bass = "assets/music/music2/6_AGBass.mid"
melt_kit = "assets/music/music2/7_MeltKit.mid"
beats1 = "assets/judging/beats1.mid"
beats2 = "assets/judging/beats2.mid"
