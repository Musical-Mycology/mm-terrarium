[bit]
name = "Rev1Bit"
version = "1.0.0"
description = "Bench check for the Rev 1 ESP32 board: one visible response per tap, hold and swing"
entry = "rev1_bit:Rev1Bit"
kind = "tool"
requires_terrarium_api = 1

[launch]
room_types = ["TEST", "DEMO"]
default_room_type = "TEST"
default_devices = 1
default_join_role = "sim"

[launch.nodes]
player = "REV1_PLAYER_NODE"
sim = "REV1_SIM_NODE"

[start]
when = "immediate"

[console]
display_name = "Rev 1 Board Check"
notes = "Join a Rev 1 board to REV1_PLAYER_NODE, or a standard tuneshroom or sim to REV1_SIM_NODE (tap only). Tap steps the hue, hold flashes white, swing flashes red (negative) or blue (positive)."
