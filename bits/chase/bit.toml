[bit]
name = "ChaseBit"
version = "1.0.0"
description = "Reference cross-fixture chase, written to the TEST Room spec (main then accent)"
entry = "chase_bit:ChaseBit"
kind = "tool"
requires_terrarium_api = 1

[launch]
room_types = ["TEST"]
default_room_type = "TEST"
default_devices = 1
default_join_role = "player"

[launch.nodes]
player = "TEST_PLAYER_NODE"
jammer = "TEST_JAM_NODE"

[start]
when = "immediate"

[console]
display_name = "Chase"

[defaults]
run_duration_seconds = 2.0
