[bit]
name = "MinigameBit"
version = "0.1.0"
description = "Single-Tuneshroom bench toy: tap starts 10 white blinks 2 s apart, tap again resets"
entry = "minigame_bit:MinigameBit"
kind = "tool"
requires_terrarium_api = 1

[launch]
room_types = ["TEST"]
default_room_type = "TEST"
default_devices = 1
default_join_role = "player"

[launch.nodes]
player = "MINIGAME_PLAYER_NODE"

[start]
when = "immediate"

[console]
display_name = "Minigame"
notes = "Join one device on MINIGAME_PLAYER_NODE. It waits in PENDING until a tap starts a round (INGAME): the LED blinks white 10 times, 2 s apart, then the round ends on its own (END). A tap in INGAME or END resets to PENDING. No scoring, and it never completes on its own, so unload it when done."
