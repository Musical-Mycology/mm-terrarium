[bit]
name = "MinigameBit"
version = "0.8.0"
description = "Four-phase white build on every devtower<N> device: the phase's group of four lights blinks white at 130 BPM over the groups below it held solid, switched from the Console; each tap flashes the tapping ie<N> shroom purple"
entry = "minigame_bit:MinigameBit"
kind = "tool"
requires_terrarium_api = 1

[launch]
room_types = ["TEST"]
default_room_type = "TEST"
default_devices = 1
default_join_role = "player"

[launch.nodes]
player = "MINIGAME_PLAYER_NODE"

[start]
when = "immediate"

[console]
display_name = "Minigame"
notes = "Connect devtower<N> devices (devtower1, devtower2, ...) and ie<N> devices; any other device keeps its own solo behaviour. A Tower is a plain device, not a Room fixture: it needs no Arm and must not handshake a Room node. Its 32 LEDs are four groups of four lights (two LEDs a light), bottom first. In phase N, group N blinks white at 130 BPM, each blink a quick fade in and out, and every group below it stays solid white; the groups above are dark. The Phase 1 to Phase 4 buttons on the Bit status card switch phase with one click (it starts in phase 1) without restarting the beat, which keeps one steady 130 BPM for the whole session, and a Tower that connects late shows the phase on the next beat. Every tap from an ie<N> device flashes that shroom purple, fading out to dark within a fifth of a second; taps do not move the Towers. No scoring, and it never completes on its own."
